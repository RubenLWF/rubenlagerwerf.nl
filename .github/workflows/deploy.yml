name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow this job to clone the repo and create a Pages deployment.
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      # Installs dependencies with npm (detected from package-lock.json) and runs `npm run build`,
      # which type-checks with `astro check` before building.
      - name: Install, build, and upload site
        uses: withastro/action@v6
        env:
          # Public value: it is bundled into the client-side script.
          PUBLIC_VERCEL_API_BASE: 'https://spotify-api-proxy.rubenlagerwerf.nl/api'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
